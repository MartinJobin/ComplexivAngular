<div class="registro-container">
  <h2>Crear una Cuenta</h2>

  <form (ngSubmit)="registrar()">
    
    <div class="form-group">
      <label>Nombre completo:</label>
      <input type="text" [(ngModel)]="nombre" name="nombre" required placeholder="Ej. Juan Pérez">
    </div>

    <div class="form-group">
      <label>Correo electrónico:</label>
      <input type="email" [(ngModel)]="email" name="email" required placeholder="ejemplo@correo.com">
    </div>

    <div class="form-group">
      <label>Contraseña:</label>
      <input type="password" [(ngModel)]="password" name="password" required placeholder="********">
    </div>

    <div class="form-group">
      <label>Tipo de cuenta:</label>
      <select [(ngModel)]="rolSeleccionado" name="rol">
        <option value="estandar">Usuario Estándar (Solo ver catálogo)</option>
        <option value="admin">Administrador (Gestión total)</option>
      </select>
    </div>

    <button type="submit">Registrarse</button>
  </form>

  <p style="margin-top: 15px;">
    ¿Ya tienes cuenta? <a routerLink="/login">Inicia Sesión aquí</a>
  </p>
</div>
